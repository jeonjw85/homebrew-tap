name: Bump graft cask

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  repository_dispatch:
    types: [graft-release]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cask to latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/bump-graft.sh
